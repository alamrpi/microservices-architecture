name: Catalog API Pipeline

on:
  push:
    branches: [ "master" ]
    paths:
      - 'src/Services/Catalog.API/**'
      - '.github/workflows/catalog-pipeline.yml'
  workflow_dispatch:

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Login to Docker Hub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}

    - name: Build and push Catalog API image
      uses: docker/build-push-action@v5
      with:
        context: ./src/Services/Catalog.API/Catalog.API
        file: ./src/Services/Catalog.API/Catalog.API/Dockerfile
        push: true
        tags: ${{ secrets.DOCKER_USERNAME }}/eshop-catalog:latest
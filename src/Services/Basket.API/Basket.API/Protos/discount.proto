syntax = "proto3";

option csharp_namespace = "Basket.API.Protos";

service DiscountService {
  rpc GetDiscount (GetDiscountRequest) returns (DiscountModel);
}

message GetDiscountRequest {
  string product_id = 1;
}

message DiscountModel {
  string product_id = 1;
  string description = 2;
  double amount = 3;
}

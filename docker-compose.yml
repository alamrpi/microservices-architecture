version: '3.4'

services:

  # --- INFRASTRUCTURE ---

  eshop-db:
    image: postgres:16-alpine
    container_name: eshop-postgres
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=mysecretpassword
      - POSTGRES_DB=CatalogDb
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: always

  eshop-redis:
    image: redis
    container_name: eshop-redis
    restart: always

  eshop-rabbitmq:
    image: rabbitmq:management
    container_name: eshop-rabbitmq
    ports:
      - "15672:15672"
      - "5672:5672"
    environment:
      - RABBITMQ_DEFAULT_USER=guest
      - RABBITMQ_DEFAULT_PASS=guest
    restart: always

  eshop-sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: eshop-sqlserver
    environment:
      - ACCEPT_EULA=Y
      - MSSQL_SA_PASSWORD=MySecretPassword123!
    restart: always

  # --- MICROSERVICES ---

  catalog-api:
    build:
      context: ./src/Services/Catalog.API/Catalog.API
      dockerfile: Dockerfile
    container_name: eshop-catalog
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__CatalogDb=Host=eshop-postgres;Port=5432;Database=CatalogDb;Username=postgres;Password=mysecretpassword
    depends_on:
      eshop-db:
        condition: service_healthy

  basket-api:
    build:
      context: ./src/Services/Basket.API/Basket.API
      dockerfile: Dockerfile
    container_name: eshop-basket
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__Database=Host=eshop-postgres;Port=5432;Database=BasketDb;Username=postgres;Password=mysecretpassword
      - ConnectionStrings__Redis=eshop-redis:6379
      - Services__DiscountUrl=http://eshop-discount:8080 
    depends_on:
      - eshop-db
      - eshop-redis
      - eshop-rabbitmq

  discount-api:
    build:
      context: ./src/Services/Discount.API/Discount.API
      dockerfile: Dockerfile
    container_name: eshop-discount
    ports:
      - "8081:8080"

  ordering-api:
    build:
      context: ./src/Services/Ordering
      dockerfile: Ordering.API/Dockerfile
    container_name: eshop-ordering
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__OrderingDb=Server=eshop-sqlserver;Database=OrderingDb;User Id=sa;Password=MySecretPassword123!;TrustServerCertificate=True
      - RabbitMq__Host=eshop-rabbitmq
    depends_on:
      - eshop-sqlserver
      - eshop-rabbitmq

  # --- API GATEWAY ---
  
  api-gateway:
    build:
      context: ./src/ApiGateway
      dockerfile: Dockerfile
    container_name: eshop-gateway
    ports:
      - "5000:8080"
    environment:
      - ReverseProxy__Clusters__catalog-cluster__Destinations__destination1__Address=http://eshop-catalog:8080
      - ReverseProxy__Clusters__basket-cluster__Destinations__destination1__Address=http://eshop-basket:8080
      - ReverseProxy__Clusters__ordering-cluster__Destinations__destination1__Address=http://eshop-ordering:8080
    depends_on:
      - catalog-api
      - basket-api
      - ordering-api

  # --- FRONTEND ---

  eshop-client:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: eshop-client
    ports:
      - "5173:5173"
    environment:
      - CHOKIDAR_USEPOLLING=true
    volumes:
      - ./client:/app
      - /app/node_modules
    depends_on:
      - api-gateway

volumes:
  postgres_data: